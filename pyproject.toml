[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sunflower-genomic-prediction"
version = "1.1.0"
description = "Genomic prediction and association analysis of a sunflower breeding panel"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2,<3",
  "pyarrow>=15",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "pillow>=10",
  "openpyxl>=3.1",
  "pysam>=0.22",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
provenance = ["scikit-allel>=1.3"]


[tool.hatch.build.targets.wheel]
packages = ["src/sunflower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "external: requires gemma, plink1.9 and R/sommer",
  "slow: reproduces a deposited table and takes minutes",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Long f-strings are deliberately split across lines for readability.
ignore = ["ISC004"]
